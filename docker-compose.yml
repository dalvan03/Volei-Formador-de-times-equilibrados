services:
  postgres:
    image: postgres:16-alpine
    container_name: volei-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: voleidb
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - nginx-proxy-network

  volei-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: volei-studio
    restart: unless-stopped
    depends_on:
      - postgres
    command: ["npx", "drizzle-kit", "studio", "--config=drizzle.config.ts", "--port", "4983", "--host", "0.0.0.0"]
    environment:
      - DATABASE_URL=postgres://postgres:postgrespassword@postgres:5432/voleidb
    ports:
      - "4983:4983"
    networks:
      - nginx-proxy-network

  volei-formador-de-times:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: volei-formador-de-times
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgres://postgres:postgrespassword@postgres:5432/voleidb
    volumes:
      - ./data:/app/data
    networks:
      - nginx-proxy-network

networks:
  nginx-proxy-network:
    external: true
    name: nginx-proxy
